<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoCheck — сравнение</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="compare.css">
</head>
<body>
<header>
  <div class="hd-left"><h1>GeoCheck</h1><span class="sub">сравнение по истории проверок</span></div>
  <div class="hd-right">
    <a class="btn" href="/">← К проверке</a>
  </div>
</header>
<div class="cmp">
  <div class="bar">
    <label>Период:
      <select id="days"><option value="">всё время</option><option value="1">24 часа</option><option value="7">7 дней</option><option value="30">30 дней</option></select>
    </label>
    <span id="meta" class="ctl-hint"></span>
  </div>
  <section><h2>Ресурсы: доступность по всем проверкам</h2><div class="scroll"><table id="tTargets"></table></div></section>
  <section><h2>Точки наблюдения (VPN-выходы): средняя доступность и средний отклик</h2><div class="scroll"><table id="tExits"></table></div></section>
  <section><h2>Таблица: ресурс × выход (доступность %, средний отклик)</h2><div class="scroll"><table id="tMatrix"></table></div></section>
</div>
<script src="compare.js"></script>
</body>
</html>
